<template>
    <lightning-card title={title} icon-name="standard:return_order">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={isError}>
                <p data-id="error" class="slds-text-color_error">{errorMessage}</p>
            </template>
            <template lwc:elseif={isLoading}>
                <p data-id="loading">{loadingText}</p>
            </template>
            <template lwc:elseif={isDecided}>
                <p data-id="decided">{decidedText}</p>
            </template>
            <template lwc:elseif={isWaiting}>
                <p data-id="waiting">{waitingText}</p>
            </template>
            <template lwc:else>
                <p data-id="no-decision">{noDecisionText}</p>
            </template>
            <template lwc:if={showButton}>
                <div class="slds-var-m-top_small">
                    <lightning-button
                        data-id="check-again"
                        label={checkAgainLabel}
                        disabled={buttonDisabled}
                        onclick={handleCheckAgain}
                    ></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
